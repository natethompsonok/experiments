<style>
/* Layout: full-bleed WebGL stage on the left, a narrow instrument panel of sliders on the right; stacks on phones with the stage pinned on top. */
:root {
  --ground: #e4e7ec;
  --panel: #f5f6f8;
  --ink: #15171c;
  --muted: #5d6474;
  --line: #d4d8e0;
  --track: #dce0e7;
  --chip: #eaedf1;
  --accent: #2a3ff5;
  --accent-ink: #ffffff;
  --overlay: rgba(245, 246, 248, 0.82);
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1015; --panel: #14171d; --ink: #e6e8ee; --muted: #959cab; --line: #262a33;
    --track: #2a2f39; --chip: #1c2028; --accent: #8e9cff; --accent-ink: #0e1015; --overlay: rgba(20, 23, 29, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1015; --panel: #14171d; --ink: #e6e8ee; --muted: #959cab; --line: #262a33;
  --track: #2a2f39; --chip: #1c2028; --accent: #8e9cff; --accent-ink: #0e1015; --overlay: rgba(20, 23, 29, 0.8);
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; }
.stage { position: relative; min-width: 0; overflow: hidden; background: var(--ground); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }

.hud { position: absolute; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.tl { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); }
.hud.bl { bottom: 12px; left: max(12px, env(safe-area-inset-left, 0px)); }
.hud.br { bottom: 12px; right: 12px; }
.pill {
  font: 500 11px/1 var(--f-mono); letter-spacing: 0.02em; color: var(--ink);
  background: var(--overlay); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; white-space: nowrap;
}
.pill.hint { color: var(--muted); transition: opacity .6s; }
.pill.hint.gone { opacity: 0; }
.pill.warn { border-color: #d9534f; }
button.pill { cursor: pointer; }
button.pill:hover { border-color: var(--accent); }

.panel {
  background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0;
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  margin: 0; font: 800 34px/0.9 var(--f-display); font-variation-settings: "opsz" 96; letter-spacing: -0.035em;
  text-wrap: balance;
}
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }

.row { display: flex; gap: 8px; align-items: center; }
.row > select { flex: 1; min-width: 0; }

.btn {
  border: 1px solid var(--line); background: var(--chip); border-radius: 7px; padding: 7px 11px; cursor: pointer;
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.icon { padding: 7px 10px; font-family: var(--f-mono); }

select, input[type="text"], textarea {
  background: var(--chip); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px; width: 100%;
}
textarea { resize: vertical; min-height: 64px; font: 600 15px/1.25 var(--f-ui); letter-spacing: 0.02em; }

details.sec { border-top: 1px solid var(--line); padding-top: 10px; }
details.sec > summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline;
  font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); padding-block: 4px 8px;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "−"; font-size: 14px; }
details.sec:not([open]) > summary::after { content: "+"; }
.sec-body { display: flex; flex-direction: column; gap: 12px; }

.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; user-select: none; }
.ctl .lbl span { cursor: default; }
.ctl output { font: 500 11.5px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl.inline { flex-direction: row; justify-content: space-between; align-items: center; }
.ctl.inline .lbl { flex: 1; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--track) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track); }
input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }

.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="color"] { width: 44px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--chip); cursor: pointer; }
.colors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.modes button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 8px 9px; cursor: pointer; min-width: 0;
}
.modes button b { font: 700 14px/1 var(--f-display); letter-spacing: -0.01em; }
.modes button small { font: 10px/1.15 var(--f-mono); color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.modes button[aria-pressed="true"] small { color: inherit; opacity: .8; }

.font-row { display: flex; gap: 6px; }
.font-row select, .font-row input { flex: 1; min-width: 0; }

.foot { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.small { font-size: 11.5px; color: var(--muted); margin: 0; }

dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 16px;
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
}
dialog::backdrop { background: rgba(10, 12, 16, 0.55); }
dialog img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
dialog .dlg-body { display: flex; flex-direction: column; gap: 12px; }
dialog textarea { font: 12px/1.45 var(--f-mono); min-height: 260px; letter-spacing: 0; }
dialog h2 { margin: 0; font: 700 20px/1.1 var(--f-display); }

.guide { position: absolute; border: 1.5px dashed var(--accent); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28); pointer-events: none; z-index: 1; }
.stage canvas { object-fit: contain; }
.dropping .stage::after { content: "Drop an image to map it onto the letters"; position: absolute; inset: 12px; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: 12px; background: var(--overlay); font: 600 15px var(--f-ui); color: var(--ink); z-index: 4; }
dialog video { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #000; }
.upload { display: flex; gap: 8px; align-items: center; }
.upload img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); }
.upload label.btn { flex: 1; text-align: center; }
.upload input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.exp-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btn[disabled] { opacity: .5; cursor: progress; }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; height: 50svh; border-bottom: 1px solid var(--line); }
  .panel { border-left: 0; overflow: visible; }
  .hud.tl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="guide" id="guide" hidden></div>
    <div class="hud tl"><span class="pill hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan</span></div>
    <div class="hud bl"><span class="pill" id="status">Starting…</span></div>
    <div class="hud br">
      <button class="pill" id="btnPlay" type="button" aria-pressed="false">Pause</button>
      <button class="pill" id="btnView" type="button">Reset view</button>
      <button class="pill" id="btnSnap" type="button">Snapshot</button>
    </div>
  </div>
  <aside class="panel" id="panel">
    <div class="brand">
      <h1>Glyph Matter</h1>
      <p>Generative type as form, material and space.</p>
    </div>
    <div class="row">
      <select id="presetSel" aria-label="Preset"></select>
      <button class="btn primary" id="btnRandom" type="button" title="Shortcut: R">Randomize</button>
    </div>
    <div id="controls"></div>
    <div class="foot">
      <button class="btn" id="btnSettings" type="button">Settings JSON</button>
      <button class="btn" id="btnResetAll" type="button">Reset all</button>
    </div>
    <p class="small">Double-click any slider label to reset it. Press R to randomize.</p>
  </aside>
</div>

<dialog id="outDlg">
  <div class="dlg-body">
    <h2 id="outTitle">Snapshot</h2>
    <div id="outMedia"></div>
    <p class="small" id="outInfo"></p>
    <div class="row"><button class="btn primary" id="outSave" type="button">Download</button><button class="btn" type="button" data-close>Close</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <div class="dlg-body">
    <h2>Settings</h2>
    <p class="small">Copy these to save a design, or paste settings here and apply them.</p>
    <textarea id="setText" spellcheck="false" aria-label="Settings JSON"></textarea>
    <p class="small" id="setMsg"></p>
    <div class="row"><button class="btn" id="setCopy" type="button">Copy</button><button class="btn primary" id="setApply" type="button">Apply</button><button class="btn" type="button" data-close>Close</button></div>
  </div>
</dialog>

function addSheet(url) {
  return new Promise((res, rej) => {

}
function ensureFont(family) {
  if (!sheetCache.has(family)) {
    const base = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(family).replace(/%20/g, '+');

      if (spec) return addSheet(base + ':wght@' + spec + '&display=block');
      try { await addSheet(base + ':wght@100..900&display=block'); }

    sheetCache.set(family, p);

let downloadsP = null;

async function saveFile(name, blob) {

}

/* -------------------------------------------------------------- capture */
const FRAMES = { '16:9': 16 / 9, '1:1': 1, '4:5': 0.8, '9:16': 9 / 16 };

}

const tick = () => new Promise(r => setTimeout(r, 0));

async function snapshot() {

async function exportGif() {
  if (busy || !G) return; setBusy(true);
  const a = frameAspect(), w = Math.round(+P.gifWidth / 2) * 2, h = Math.round(w / a / 2) * 2, fps = +P.gifFps;
  const N = Math.max(2, Math.min(Math.round(P.loopLen * fps), Math.floor(240e6 / (w * h * 4))));
  const frames = [];

async function recordVideo() {

/* ---------------------------------------------------------- GIF encoder */
function medianCut(S, K) {
  let boxes = [Uint32Array.from({ length: S.length / 3 }, (_, i) => i)];

    const mn = [255, 255, 255], mx = [0, 0, 0];

    const r = [mx[0] - mn[0], (mx[1] - mn[1]) * 1.2, mx[2] - mn[2]]; const ch = r.indexOf(Math.max(...r));
    return { ch, r: r[ch] };

  while (boxes.length < K) {
    let bi = -1, best = 0, bch = 0;
    for (let i = 0; i < boxes.length; i++) {
      if (boxes[i].length < 2) continue;
      const { ch, r } = span(boxes[i]), score = r * Math.sqrt(boxes[i].length);
      if (score > best) { best = score; bi = i; bch = ch; }
    }
    if (bi < 0) break;
    const arr = Array.from(boxes[bi]).sort((p, q) => S[p * 3 + bch] - S[q * 3 + bch]), m = arr.length >> 1;
    boxes.splice(bi, 1, Uint32Array.from(arr.slice(0, m)), Uint32Array.from(arr.slice(m)));
  }
  return boxes.map(b => { let r = 0, g = 0, bl = 0; for (const i of b) { r += S[i * 3]; g += S[i * 3 + 1]; bl += S[i * 3 + 2]; } const n = Math.max(1, b.length); return [Math.round(r / n), Math.round(g / n), Math.round(bl / n)]; });
}
class Bytes {

  b(v) { if (this.n >= this.a.length) { const t = new Uint8Array(this.a.length * 2); t.set(this.a); this.a = t; } this.a[this.n++] = v; }

const LZW_TABLE = new Int16Array(4096 * 256);

async function encodeGif(frames, w, h, fps, progress) {
